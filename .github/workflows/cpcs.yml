name: ClassicPress Directory Coding Standard checks.

on: [pull_request, push]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    phpcs:
        name: CPCS
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.3"
                  tools: composer
            - name: Install PHPCS and WPCS
              run: |
                  composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
                  composer global require squizlabs/php_codesniffer:^3.13 dealerdirect/phpcodesniffer-composer-installer wp-coding-standards/wpcs:^3.4.1
                  echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"
            - name: Get CPCS rules
              run: |
                  wget -O phpcs.xml https://raw.githubusercontent.com/ClassicPress/ClassicPress-Coding-Standards/main/phpcs.xml
                  sed -i '/^\t<!-- start config -->.*/a\
                    <file>.</file>
                    ' phpcs.xml
                  sed -i '/MY_DOMAIN/ s//w3p-seo/' phpcs.xml
                  sed -i '/check_translator_comments/d; /use_default_whitelist/d' phpcs.xml
                  sed -i '/^\t<!-- start config -->.*/a\
                    <rule ref="Universal.Arrays.DisallowShortArraySyntax.Found"><severity>0</severity></rule>
                    ' phpcs.xml
            - name: CPCS checks
              run: phpcs --standard=phpcs.xml --report-json=./phpcs.json
            - name: Update summary
              if: ${{ always() && hashFiles('phpcs.json') != '' }}
              run: |
                  npm i -g github:10up/phpcs-json-to-md
                  phpcs-json-to-md --path ./phpcs.json --output ./phpcs.md
                  cat phpcs.md >> $GITHUB_STEP_SUMMARY
